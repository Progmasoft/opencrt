name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and targets
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install BSD Make and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bmake clang lld llvm
      - name: Test on Linux amd64, with no other libc
        run: bmake AR=llvm-ar test
      - name: Compile for amd64 and aarch64 Mach-O
        run: bmake targets

  format:
    name: Format
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The profile of Progmasoft Core C Coding Guidelines needs clang-format 23.
      - name: Format
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bmake
          python3 -m venv "$RUNNER_TEMP/format"
          "$RUNNER_TEMP/format/bin/pip" install clang-format==23.1.5
          bmake format CLANG_FORMAT="$RUNNER_TEMP/format/bin/clang-format"
